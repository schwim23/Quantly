[project]
name = "quantly"
version = "0.1.0"
description = "AI-powered swing trading signal engine"
requires-python = ">=3.11"
dependencies = [
    # Core data
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "httpx>=0.27",
    # Data sources
    "polygon-api-client>=1.13",
    "alpha-vantage>=2.3",
    "yfinance>=0.2",          # fallback / prototyping
    "praw>=7.7",              # Reddit API
    "sec-edgar-downloader>=5.0",
    # ML
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "optuna>=3.6",            # hyperparameter tuning
    # NLP / sentiment
    "transformers>=4.40",
    "torch>=2.2",
    "vaderSentiment>=3.3",
    "nltk>=3.8",
    # AI
    "anthropic>=0.28",
    # Storage
    "sqlalchemy>=2.0",
    # CLI / output
    "rich>=13.7",
    "click>=8.1",
    "python-dotenv>=1.0",
    # Technical analysis
    "ta>=0.11",
    "pandas-ta>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

[project.scripts]
quantly = "quantly.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
